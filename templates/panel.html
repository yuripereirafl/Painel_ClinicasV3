<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Senhas</title>
    <link rel="stylesheet" href="/static/stylePanel.css?v=2.3">
</head>

<body>
    <div id="panel-container">
        <div id="sidebar">
            <img id="clinic-logo" src="/static/logoo.png" alt="Logo da Clínica">
            <h3>Últimas Senhas Chamadas</h3>
            <div id="info-box">
                <span>Senha</span>
                <span>Guichê</span>
            </div>
            <ul id="recent-list"></ul>
        </div>

        <div id="main-content">
            <div id="header">
                <div class="header-item">
                    <span>Senha:</span>
                    <h1 id="current-password">0</h1>
                </div>
                <div class="header-item">
                    <span>Guichê:</span>
                    <h1 id="current-guiche">0</h1>
                </div>
                <div id="queue-name-display"></div>
            </div>

            <div id="video-container">
                <video id="clinic-video" controls autoplay muted loop>
                    <source src="/static/video2025.mp4" type="video/mp4">
                    Seu navegador não suporta vídeos HTML5.
                </video>

                <!-- Modal centralizado sobre o vídeo -->
                <div id="name-modal" class="modal" style="display: none;">
                    <div class="modal-content">
                        <h3>Paciente:</h3>
                        <h1 id="modal-name">Nome do Paciente</h1>
                        <h3>Guichê:</h3>
                        <h2 id="modal-guiche">1</h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- Data, Hora e Unidade fora do vídeo, no canto inferior esquerdo -->
        <div id="footer">
            <span id="current-date"></span> | <span id="current-time"></span> | <span id="current-unit">Unidade {{
                clinic.name }}</span>
        </div>
    </div>

    <!-- Elementos de Áudio Ocultos -->
    <audio id="sound-alert" src="/static/som_chamada.mp3" preload="auto" style="display:none;"></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script>
        function openFullscreen() {
            const panelContainer = document.getElementById('panel-container');
            if (panelContainer.requestFullscreen) {
                panelContainer.requestFullscreen();
            } else if (panelContainer.webkitRequestFullscreen) {
                panelContainer.webkitRequestFullscreen();
            } else if (panelContainer.msRequestFullscreen) {
                panelContainer.msRequestFullscreen();
            }
        }

        window.onload = function () {
            openFullscreen();
        };

        var socket = io.connect('http://' + document.domain + ':' + location.port);
        var clinic_id = {{ clinic.id | tojson }};
        socket.emit('join', { 'clinic_id': clinic_id });

        // --- Lógica de Áudio Robusta para HDMI/Splitter ---
        function playNotificationSound() {
            const playOnce = (delay = 0) => {
                setTimeout(() => {
                    const sound = new Audio('/static/som_chamada.mp3?v=' + Date.now());
                    sound.play().catch(() => {});
                }, delay);
            };

            // Wake-up signal para HDMI Splitter (Mantido para garantir que o canal abra)
            try {
                const context = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = context.createOscillator();
                const gain = context.createGain();
                gain.gain.value = 0.001; // Ainda mais baixo para ser imperceptível
                oscillator.connect(gain);
                gain.connect(context.destination);
                oscillator.start(0);
                oscillator.stop(0.1);
            } catch (e) {}

            // Agora toca apenas 1 vez conforme solicitado
            playOnce(0);
        }

        function loadCurrentState() {
            fetch(`/api/clinic/${clinic_id}/called_today`)
                .then(res => res.json())
                .then(data => {
                    if (data.length > 0) {
                        const queueMap = {
                            'NORMAL': 'queue-normal',
                            'PRIORITARIA': 'queue-prioritaria',
                            'DR_CENTRAL': 'queue-dr_central',
                            'ODONTO': 'queue-odonto'
                        };
                        const last = data[0];
                        document.getElementById('current-password').innerHTML = last.number;
                        document.getElementById('current-guiche').innerHTML = last.guiche;

                        const header = document.getElementById('header');
                        header.className = '';
                        header.classList.add(queueMap[last.queue_type] || 'queue-normal');

                        const recentList = document.getElementById('recent-list');
                        recentList.innerHTML = '';
                        data.slice(0, 5).forEach(p => {
                            const newItem = document.createElement('li');
                            newItem.className = queueMap[p.queue_type] || 'queue-normal';
                            newItem.innerHTML = `<span>${p.number}</span><span>${p.guiche}</span>`;
                            recentList.appendChild(newItem);
                        });
                    }
                })
                .catch(err => console.error("Erro ao sincronizar painel:", err));
        }

        function checkDailyReload(now) {
            const today = now.toDateString();
            if (now.getHours() === 3 && now.getMinutes() === 0) {
                if (localStorage.getItem('lastReload') !== today) {
                    localStorage.setItem('lastReload', today);
                    location.reload();
                }
            }
        }

        function updateStatus(connected) {
            const footer = document.getElementById('footer');
            footer.style.borderLeft = connected ? "5px solid #28a745" : "5px solid #dc3545";
        }

        // EVENTO: Nova Senha (O som toca APENAS aqui)
        socket.on('new_password', function (data) {
            document.getElementById('current-password').innerHTML = data.password;
            document.getElementById('current-guiche').innerHTML = data.guiche;

            const header = document.getElementById('header');
            header.className = ''; 

            const queueMap = {
                'NORMAL': { class: 'queue-normal' },
                'PRIORITARIA': { class: 'queue-prioritaria' },
                'DR_CENTRAL': { class: 'queue-dr_central' },
                'ODONTO': { class: 'queue-odonto' }
            };

            const queueInfo = queueMap[data.queue_type] || queueMap['NORMAL'];
            header.classList.add(queueInfo.class);

            // Dispara o barulho da senha
            playNotificationSound();

            var recentList = document.getElementById('recent-list');
            var newItem = document.createElement('li');
            newItem.className = queueInfo.class;
            newItem.innerHTML = `<span>${data.password}</span><span>${data.guiche}</span>`;
            recentList.insertBefore(newItem, recentList.firstChild);

            if (recentList.children.length > 5) {
                recentList.removeChild(recentList.lastChild);
            }
        });

        function updateDateTime() {
            var now = new Date();
            document.getElementById('current-date').innerHTML = now.toLocaleDateString();
            document.getElementById('current-time').innerHTML = now.toLocaleTimeString();
            checkDailyReload(now);
        }

        setInterval(updateDateTime, 1000);
        updateDateTime();

        // EVENTO: Chamada pelo Nome (Mantém apenas o TTS, sem o barulho da senha)
        socket.on('name_called', function (data) {
            if (data && data.name && data.guiche) {
                const modal = document.getElementById('name-modal');
                const modalName = document.getElementById('modal-name');
                const modalGuiche = document.getElementById('modal-guiche');
                modalName.textContent = data.name;
                modalGuiche.textContent = data.guiche;
                modal.style.display = 'flex';

                const texto = `Paciente ${data.name}, por favor, dirigir-se ao guichê ${data.guiche}`;

                fetch('/api/tts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ texto })
                })
                .then(response => response.json())
                .then(data => {
                    const audio = new Audio(data.url);
                    audio.play().catch(() => {
                        audio.addEventListener('canplaythrough', () => {
                            audio.play();
                        }, { once: true });
                        audio.load();
                    });
                })
                .catch(err => console.error("Erro TTS:", err));

                setTimeout(() => {
                    modal.style.display = 'none';
                }, 7000);
            }
        });

        socket.on('connect', function () {
            socket.emit('join', { 'clinic_id': clinic_id });
            loadCurrentState();
            updateStatus(true);
        });

        socket.on('disconnect', function () {
            updateStatus(false);
            setTimeout(() => {
                if (!socket.connected) location.reload();
            }, 30000);
        });

        // Desbloqueia áudio no primeiro clique
        document.body.onclick = function() {
            openFullscreen();
            const silent = new Audio();
            silent.play().catch(() => {});
        };
    </script>


    </script>
</body>

</html>
